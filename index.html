dy.game-fullscreen #newGameHub>p{display:none!important}body.game-fullscreen #newGameFrame{position:absolute!important;inset:0!important;width:100%!important;height:100%!important;min-height:100%!important;max-height:none!important;border:0!important;border-radius:0!important;background:#24152b!important}body.game-fullscreen footer{display:none!important}\n\u003c/style>\u003c/head>\u003cbody>\n\u003cdiv class=\"floaties\" id=\"floaties\">\u003c/div>\u003cdiv class=\"wrap\">\n\u003cdiv class=\"top\">\u003cdiv class=\"brand\">A PERSONAL NOTE · FOR YOU\u003c/div>\u003cbutton class=\"music\" id=\"musicBtn\">▶ \u003cspan id=\"musicLabel\">✨ Our Favorite Song\u003c/span>\u003c/button>\u003c/div>\n\u003cdiv class=\"progress\">\u003cspan class=\"dot active\">\u003c/span>\u003cspan class=\"dot\">\u003c/span>\u003cspan class=\"dot\">\u003c/span>\u003cspan class=\"dot\">\u003c/span>\u003c/div>\n\u003cmain class=\"page active\" id=\"page1\">\n\u003cheader class=\"hero\">\u003cdiv class=\"tag\">A SMALL PERSONAL GESTURE\u003c/div>\u003ch1>Some things are \u003cspan>better said simply.\u003c/span>\u003c/h1>\u003cp class=\"sub\">Lewat halaman sederhana ini, aku cuma mau nyampein sesuatu buat kamu. Dilihat sampai habis yaaa, sayangg.\u003c/p>\u003cdiv class=\"actions\">\u003cbutton class=\"btn primary\" id=\"startBtn\">Lihat halaman\u003c/button>\u003cbutton class=\"btn soft\" id=\"music2\">✨ Our Favorite Song\u003c/button>\u003c/div>\u003c/header>\n\u003csection class=\"question glass\">\u003cdiv class=\"sticker\">🧸\u003c/div>\u003cdiv class=\"kicker\">SATU PERTANYAAN\u003c/div>\u003ch2>Dari semua hal hebat di dunia ini, hal paling indah buat aku adalah terus melangkah bareng kamu...Mau kan kita terus bersama,\u003cbr>Selamaa-lamanya?\u003c/h2>\u003cp class=\"muted\">Pilih tombol di bawah ini sebagai tanda kalau kamu juga mau kita terus bareng..\u003c/p>\u003cdiv class=\"actions\">\u003cbutton class=\"btn primary\" id=\"yes\">Mau selamanya sama kamu\u003c/button>\u003cbutton class=\"btn soft\" id=\"shy\">Aku masih memikirkannya\u003c/button>\u003c/div>\u003cdiv class=\"feedback\" id=\"feedback\">\u003c/div>\u003c/section>\n\u003cdiv class=\"head\">\u003csmall>HAL YANG INGIN DI INGAT\u003c/small>\u003ch2>Sesuatu yang aku ingin sampein\u003c/h2>\u003cp>Sengaja bikin halaman ini biar aku bisa ngungkapin hal-hal yang kadang malu kalau dibilang langsung. Luangin waktu sebentar yaa sayangg buat baca sampai habis.\u003c/p>\u003c/div>\n\u003cdiv class=\"cards\">\u003carticle class=\"card glass\">\u003cdiv class=\"emoji\">01\u003c/div>\u003ch3>Perhatian kecilmu\u003c/h3>\u003cp>Makasih yaa sayang selalu merhatiin hal-hal kecil, dan gak pernah biarin aku ngerasa sendirian teruss\u003c/p>\u003c/article>\u003carticle class=\"card glass\">\u003cdiv class=\"emoji\">02\u003c/div>\u003ch3>Nyaman ngobrol apa ajaa\u003c/h3>\u003cp>Seneng banget kita bisa cerita apa aja, saling dengerin, dan ngelewatin semua hal bareng-bareng.\u003c/p>\u003c/article>\u003carticle class=\"card glass\">\u003cdiv class=\"emoji\">03\u003c/div>\u003ch3>Bareng terus selamanya\u003c/h3>\u003cp>Maaff yaa kalau kadang aku nyebelin dan bikin kamu kesel. Tapi janji yaa jangan pernah kepikiran buat pisah, karena akuu maunya sama kamu teruss selama-lamanyaaa\u003c/p>\u003c/article>\u003c/div>\n\u003cdiv class=\"actions\">\u003cbutton class=\"btn primary next\">Liat foto cantiknya yuk ✨ →\u003c/button>\u003c/div>\n\u003c/main>\n\u003cmain class=\"page\" id=\"page2\">\n\u003cheader class=\"hero\">\u003cdiv class=\"tag\">PHOTO COLLECTION\u003c/div>\u003ch1>My absolute favorite person \u003cspan>in the world.\u003c/span>\u003c/h1>\u003cp class=\"sub\">Warning!! Staring at these photos may cause sudden butterflies and extreme smiling\u003c/p>\u003c/header>\n\u003cdiv class=\"gallery\" id=\"gallery\">\n\u003cdiv class=\"photo\">\u003cdiv class=\"frame\">\u003cimg alt=\"Foto kenangan 1\">\u003cdiv class=\"placeholder\">\u003cb>♡\u003c/b>FOTO 01\u003cbr>tempel link Catbox\u003c/div>\u003c/div>\u003cdiv class=\"caption\">First sight, and I'm already falling\u003c/div>\u003c/div>\n\u003cdiv class=\"photo\">\u003cdiv class=\"frame\">\u003cimg alt=\"Foto kenangan 2\">\u003cdiv class=\"placeholder\">\u003cb>✧\u003c/b>FOTO 02\u003cbr>tempel link Catbox\u003c/div>\u003c/div>\u003cdiv class=\"caption\">Foto 02\u003c/div>\u003c/div>\n\u003cdiv class=\"photo\">\u003cdiv class=\"frame\">\u003cimg alt=\"Foto kenangan 3\">\u003cdiv class=\"placeholder\">\u003cb>♡\u003c/b>FOTO 03\u003cbr>tempel link Catbox\u003c/div>\u003c/div>\u003cdiv class=\"caption\">Foto 03\u003c/div>\u003c/div>\n\u003cdiv class=\"photo\">\u003cdiv class=\"frame\">\u003cimg alt=\"Foto kenangan 4\">\u003cdiv class=\"placeholder\">\u003cb>✦\u003c/b>FOTO 04\u003cbr>tempel link Catbox\u003c/div>\u003c/div>\u003cdiv class=\"caption\">Foto 04\u003c/div>\u003c/div>\n\u003cdiv class=\"photo\">\u003cdiv class=\"frame\">\u003cimg alt=\"Foto kenangan 5\">\u003cdiv class=\"placeholder\">\u003cb>♡\u003c/b>FOTO 05\u003cbr>tempel link Catbox\u003c/div>\u003c/div>\u003cdiv class=\"caption\">Foto 05\u003c/div>\u003c/div>\n\u003cdiv class=\"photo\">\u003cdiv class=\"frame\">\u003cimg alt=\"Foto kenangan 6\">\u003cdiv class=\"placeholder\">\u003cb>✧\u003c/b>FOTO 06\u003cbr>tempel link Catbox\u003c/div>\u003c/div>\u003cdiv class=\"caption\">Foto 06\u003c/div>\u003c/div>\n\u003cdiv class=\"photo\">\u003cdiv class=\"frame\">\u003cimg alt=\"Foto kenangan 7\">\u003cdiv class=\"placeholder\">\u003cb>♡\u003c/b>FOTO 07\u003cbr>tempel link Catbox\u003c/div>\u003c/div>\u003cdiv class=\"caption\">Foto 07\u003c/div>\u003c/div>\n\u003c/div>\n\u003cdiv class=\"note glass\">\u003cb>💌 Pesan untukmu\u003c/b>\u003cbr>Koleksiii fotooo cewekkk tersayanggg udahhh selesaiii. Sekaranggg saatnyaaa bacaaa isiii hatiii akuuu yanggg palinggg akhirrr..\u003c/div>\n\u003cdiv class=\"actions\">\u003cbutton class=\"btn soft prev\">← Kembali\u003c/button>\u003cbutton class=\"btn primary next\">Baca pesan →\u003c/button>\u003c/div>\n\u003c/main>\n\u003cmain class=\"page\" id=\"page3\">\n\u003cheader class=\"hero\">\u003cdiv class=\"tag\">A NOTE TO KEEP\u003c/div>\u003ch1>A few words, \u003cspan>from the heart.\u003c/span>\u003c/h1>\u003cp class=\"sub\">Terimaa kasihh yaaa syaangg udahh selaluu nemeninnn akuu sejauhh iniii. Bacaaa pelan-pelan yaaa, inii tulusss dariii hatiii akuuu buattt kamuuuu.\u003c/p>\u003c/header>\n\u003csection class=\"letter glass\">\u003cdiv class=\"envelope\">✉\u003c/div>\u003ch2>✨ Catatan Kecil Dari Aku\u003c/h2>\u003cp class=\"muted\">Isinya cuma ungkapan tulus dari hati Tolong jangannn dii skipp yaaa dan dibaca sampai tuntass, yaaa cayanggg!\u003c/p>\u003cbutton class=\"btn primary\" id=\"letterBtn\">Buka pesan\u003c/button>\u003cdiv class=\"lettertext\" id=\"lettertext\">Makasihh banyakk yaaaa sayanggg udahhh mauuu nerimaaa akuuu dannn nemeninnn akuuuu sampaiiii sejauhhh iniiii akuuuu benerrr benerrr bersyukurrr punyaaa kamuuu diii hiduppp akuuuu.\n\nAkuuu mauuu kitaaa terusss barenggg barenggg selamaaa lamanyaaaa, semogaaa hubungannn kitaaa bisaaa langgenggg terusss keee depannyaaanyaa yaaa sayanggg, namanyaaa hubungannn pastiii adaaa ajaaa masalahnyaaa, tapiii kalauu lagiii adaaa apaaaa apaaaa, yukyy kitaaa selesaiinnyaaa baikkk baikkk, diobrolinnn pelannn pelannnn, jangannn padaaa aduuu egooo atauuu mentinginn emosiii sendiriii yaaaa sayangg\nIntinyaaaa, akuuuu sayangggg bangetttt bangett samaaaa kamuuuu Jangannn pernahhh bosennn samaaa akuuu, yaaa sayanggg!\n\n— Makasihh udahhh mauu bacaa semuaa nyaa yaa sayangg lopyuuu dehhh🤍\"\n\n— Pesann darii hatii akuu \u003c/div>\u003c/section>\n\u003csection class=\"final glass\">\u003cdiv class=\"finalmark\">—\u003c/div>\u003ch2>Sebelum menutup halaman\u003c/h2>\u003cp class=\"muted\">Terima kasih yaa sayangg udahhh meluangkan waktu untuk membacaa dan melihattt semuanyaa Semoga hariii harimuu selalu punya ruang untuk halll hall baikk.\u003c/p>\u003cbutton class=\"btn primary\" id=\"finalBtn\">Selesai membaca\u003c/button>\u003c/section>\n\ xt='position:fixed;top:8px;right:8px;z-index:100001;border:1px solid #ffffff80;border-radius:999px;padding:9px 13px;background:#3b203e;color:white;font-weight:800;box-shadow:0 3px 14px #0004';exit.onclick=()=>toggleGameFullscreen(false);document.body.appendChild(exit)}else if(!active&&exit)exit.remove();try{parent.postMessage({type:'FOR_YOU_GAME_FULLSCREEN',active},'*')}catch(e){}}document.addEventListener('keydown',e=>{if(e.key==='Escape'&&document.body.classList.contains('game-fullscreen'))toggleGameFullscreen(false)});switchNewGame(0,document.querySelector('#newGameHub .game-tabs .btn'));\u003c/script>\n\n\u003cdiv class=\"game-tabs\">\u003cbutton class=\"btn primary\" onclick=\"pickGame('claw')\">🎀 Capit\u003c/button>\u003cbutton class=\"btn soft\" onclick=\"pickGame('wheelgame')\">💗 Roda hadiah\u003c/button>\u003cbutton class=\"btn soft\" onclick=\"pickGame('puzzlegame')\">🧩 Puzzle foto\u003c/button>\u003c/div>\n\u003csection class=\"minigame glass activegame\" id=\"clawGame\">\u003ch2>Pink Claw Machine 🎀\u003c/h2>\u003cp class=\"muted\">Geser capit dengan tombol kiri/kanan, lalu tekan TURUNKAN. Coba ambil boneka, surat, atau mystery box.\u003c/p>\u003cdiv class=\"machine\">\u003cdiv class=\"machine-top\">TANZ LOVE ARCADE · 🤍 💗 💖\u003c/div>\u003cdiv class=\"machine-glass\">\u003cdiv class=\"claw-track\">\u003cdiv class=\"claw-line\" id=\"clawLine\">\u003c/div>\u003cdiv class=\"claw-hook\" id=\"clawHook\">⌁\u003c/div>\u003cdiv class=\"claw-fingers\" id=\"clawFingers\">⌄\u003c/div>\u003c/div>\u003cdiv class=\"prize-items\">\u003cspan class=\"toy\" data-prize=\"🧸\" style=\"left:13%;bottom:14px\">🧸\u003c/span>\u003cspan class=\"toy\" data-prize=\"💌\" style=\"left:43%;bottom:14px\">💌\u003c/span>\u003cspan class=\"toy\" data-prize=\"🎁\" style=\"left:72%;bottom:14px\">🎁\u003c/span>\u003cspan class=\"toy\" data-prize=\"💖\" style=\"left:27%;bottom:14px\">💖\u003c/span>\u003cspan class=\"toy\" data-prize=\"🧸\" style=\"left:60%;bottom:14px\">🧸\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"machine-controls\">\u003cbutton class=\"btn soft\" id=\"clawLeft\">◀ Kiri\u003c/button>\u003cbutton class=\"btn primary\" id=\"clawDrop\">Turunkan capit\u003c/button>\u003cbutton class=\"btn soft\" id=\"clawRight\">Kanan ▶\u003c/button>\u003c/div>\u003cdiv class=\"feedback\" id=\"clawStatus\">Pilih posisi capit terlebih dahulu.\u003c/div>\u003cdiv class=\"prize\" id=\"clawPrize\">🎁 Hadiahmu menunggu di dalam mesin.\u003c/div>\u003c/div>\u003c/section>\n\u003csection class=\"minigame glass\" id=\"wheelgame\">\u003ch2>Mystery Spin Wheel 💗\u003c/h2>\u003cp class=\"muted\">Tekan putar dan lihat hadiah mana yang ditunjuk panah.\u003c/p>\u003cdiv class=\"wheel-stage\">\u003cdiv class=\"wheel-pointer\">▼\u003c/div>\u003cdiv class=\"wheel realwheel\" id=\"wheel\">\u003cspan class=\"wheel-label l1\">🎁\u003csmall>Mystery\u003c/small>\u003c/span>\u003cspan class=\"wheel-label l2\">🧸\u003csmall>Boneka\u003c/small>\u003c/span>\u003cspan class=\"wheel-label l3\">💌\u003csmall>Surat\u003c/small>\u003c/span>\u003cspan class=\"wheel-label l4\">💖\u003csmall>Love\u003c/small>\u003c/span>\u003cspan class=\"wheel-label l5\">✨\u003csmall>Wish\u003c/small>\u003c/span>\u003cspan class=\"wheel-label l6\">🤍\u003csmall>Bonus\u003c/small>\u003c/span>\u003c/div>\u003c/div>\u003cbutton class=\"btn primary\" id=\"spinBtn\">Putar roda\u003c/button>\u003cdiv class=\"feedback\" id=\"wheelResult\">Hadiah misteri menunggu.\u003c/div>\u003c/section>\n\u003csection class=\"minigame glass\" id=\"puzzlegame\">\u003ch2>Photo Sliding Puzzle 🧩\u003c/h2>\u003cp class=\"muted\">Geser potongan foto ke kotak kosong yang bersebelahan. Susun kembali gambarnya sampai utuh.\u003c/p>\u003cdiv class=\"puzzle photo-puzzle\" id=\"puzzle\">\u003c/div>\u003cdiv class=\"feedback\" id=\"puzzleResult\">Susun foto sampai kembali utuh.\u003c/div>\u003cdiv class=\"actions\">\u003cbutton class=\"btn soft\" id=\"shufflePuzzle\">Acak ulang\u003c/button>\u003c/div>\u003c/section>\n\u003cdiv class=\"actions\">\u003cbutton class=\"btn soft\" onclick=\"showPage(3)\">← Kembali ke pesan\u003c/button>\u003cbutton class=\"btn soft\" id=\"fullscreenGameBtn\" type=\"button\" onclick=\"toggleGameFullscreen()\">⛶ Klik · Layar penuh\u003c/button>\u003cbutton class=\"btn primary\" onclick=\"showPage(1)\">Kembali ke awal\u003c/button>\u003c/div>\n\u003c/main>\n\u003cstyle>.gamecards .card{display:flex;flex-direction:column;align-items:center;text-align:center}.gamecards .actions{margin-top:12px}.prize{margin-top:14px;min-height:76px;width:100%;display:grid;place-content:center;border:1px dashed #e7a9c8;border-radius:14px;background:#fff1f7;color:#a33d72;font-weight:700;line-height:1.7}.wheel{width:100px;height:100px;margin:12px auto 0;border-radius:50%;display:grid;place-items:center;font-size:2.3rem;background:conic-gradient(#ffd5e8,#fff5fa,#f3b5d3,#ffe4f0,#ffd5e8);border:5px solid white;box-shadow:0 4px 18px #d65d9822;transition:transform 1s}.puzzle{display:grid;grid-template-columns:repeat(3,58px);gap:5px;margin:14px auto 0}.tile{height:58px;border:1px solid #f1c9dc;border-radius:10px;background:#ffe5f0;color:#8f3e68;font-size:1.1rem;font-weight:800}.tile.empty{background:#fffafd;border-style:dashed}.gamecards .card p{min-height:70px}@media(max-width:700px){.gamecards .card{display:flex}.gamecards .card p{min-height:0}}\u003c/style>\n\u003cfooter>MADE WITH CARE · FOUR PAGES\u003c/footer>\u003c/div>\n\u003cdiv class=\"lightbox\" id=\"lightbox\" aria-label=\"Tampilan foto\">\u003cbutton class=\"lightbox-controls close-lightbox\" id=\"lightClose\">Tutup ×\u003c/button>\u003cdiv class=\"lightbox-inner\">\u003cdiv class=\"counter\" id=\"lightCounter\">FOTO 01 / 07\u003c/div>\u003cimg id=\"lightImage\" alt=\"Foto diperbesar\">\u003cdiv class=\"lightbox-caption\" id=\"lightCaption\">Foto 01\u003c/div>\u003cdiv class=\"lightbox-controls\">\u003cbutton id=\"lightPrev\">← Sebelumnya\u003c/button>\u003cbutton id=\"lightNext\">Berikutnya →\u003c/button>\u003c/div>\u003c/div>\u003c/div>\n\u003cdiv class=\"modal\" id=\"modal\">\u003cdiv class=\"modalbox\">\u003cdiv class=\"emoji\" id=\"mEmoji\">💗\u003c/div>\u003ch2 id=\"mTitle\">Terima kasih\u003c/h2>\u003cp id=\"mText\">Semoga kamu tersenyum.\u003c/p>\u003cbutton class=\"btn primary\" id=\"close\">Tutup\u003c/button>\u003c/div>\u003c/div>\n\u003cscript>\n/* ===== PENGATURAN LINK: GANTI BAGIAN INI SAJA =====\n   MUSIC_URL: direct link audio Catbox .mp3/.ogg\n   PHOTO_URLS: 7 direct link gambar Catbox .jpg/.png/.webp\n*/\nconst MUSIC_URL = \"https://files.catbox.moe/qehslv.mp3\";\nconst PHOTO_URLS = [\n \"https://files.catbox.moe/b5xqsd.jpg\", // Foto 1\n \"https://files.catbox.moe/xe3q54.jpg\", // Foto 2\n \"https://files.catbox.moe/z1cl73.jpg\", // Foto 3\n \"https://files.catbox.moe/42dauw.jpg\", // Foto 4\n \"https://files.catbox.moe/giypbi.jpg\", // Foto 5\n \"https://files.catbox.moe/6eay3i.jpg\", // Foto 6\n \"https://files.catbox.moe/ovff9n.jpg\"  // Foto 7\n];\nconst CAPTIONS=[\"Foto 01\",\"Foto 02\",\"Foto 03\",\"Foto 04\",\"Foto 05\",\"Foto 06\",\"Foto 07\"];\ndocument.querySelectorAll('.photo').forEach((card,i)=>{const url=(PHOTO_URLS[i]||\"\").trim(),img=card.querySelector('img'),ph=card.querySelector('.placeholder');card.querySelector('.caption').textContent=CAPTIONS[i];if(url){img.src=url;img.onload=()=>ph.style.display='none';img.onerror=()=>{ph.style.display='flex';ph.innerHTML='\u003cb>⚠\u003c/b>Link foto gagal\u003cbr>cek direct link Catbox'}}});\nlet page=1;function showPage(n){page=Math.max(1,Math.min(4,n));document.querySelectorAll('.page').forEach((p,i)=>p.classList.toggle('active',i===page-1));document.querySelectorAll('.dot').forEach((d,i)=>d.classList.toggle('active',i===page-1));window.scrollTo({top:0,behavior:'smooth'})}\ndocument.querySelectorAll('.next').forEach(b=>b.onclick=()=>showPage(page+1));document.querySelectorAll('.prev').forEach(b=>b.onclick=()=>showPage(page-1));document.getElementById('startBtn').onclick=()=>showPage(2);document.getElementById('again').onclick=()=>showPage(1);\nconst audio=new Audio();audio.loop=true;audio.preload='none';let loaded=false;const musicBtn=document.getElementById('musicBtn');\nasync function toggleMusic(){if(!MUSIC_URL.trim()){popup('♪','LINK LAGU BELUM DIISI','Tempel direct link MP3/OGG Catbox pada const MUSIC_URL di bagian pengaturan HTML, simpan, lalu upload ulang.');return}if(!loaded){audio.src=MUSIC_URL.trim();loaded=true;audio.onerror=()=>popup('♪','LAGU GAGAL DIMUAT','Pastikan link Catbox langsung ke file audio .mp3 atau .ogg, bukan halaman upload.')}try{if(audio.paused){await audio.play();musicBtn.innerHTML='Ⅱ \u003cspan>Jeda lagu\u003c/span>'}else{audio.pause();musicBtn.innerHTML='▶ \u003cspan>Putar lagu\u003c/span>'}}catch(e){popup('♪','TIDAK BISA MEMUTAR LAGU','Cek koneksi dan pastikan link Catbox merupakan direct link audio yang benar.')}}\nmusicBtn.onclick=toggleMusic;document.getElementById('music2').onclick=toggleMusic;audio.onpause=()=>musicBtn.innerHTML='▶ \u003cspan>Putar lagu\u003c/span>';audio.onplay=()=>musicBtn.innerHTML='Ⅱ \u003cspan>Jeda lagu\u003c/span>';\nconst floaties=document.getElementById('floaties'),symbols=['🤍','💗','💖','♡','✨','🤍','💗'];for(let i=0;i\u003c25;i++){let s=document.createElement('span');s.className='floaty';s.textContent=symbols[Math.floor(Math.random()*symbols.length)];s.style.left=Math.random()*100+'%';s.style.fontSize=(13+Math.random()*19)+'px';s.style.animationDuration=(10+Math.random()*14)+'s';s.style.animationDelay=(-Math.random()*20)+'s';floaties.appendChild(s)}\nfunction burst(){for(let i=0;i\u003c18;i++){let s=document.createElement('span');s.className='floaty';s.textContent=['🤍','💗','💖'][i%3];s.style.left=(20+Math.random()*60)+'%';s.style.fontSize=(18+Math.random()*20)+'px';s.style.animationDuration=(3+Math.random()*3)+'s';floaties.appendChild(s);setTimeout(()=>s.remove(),6500)}}\nconst modal=document.getElementById('modal');function popup(e,t,c){document.getElementById('mEmoji').textContent=e;document.getElementById('mTitle').textContent=t;document.getElementById('mText').textContent=c;modal.classList.add('open')}\ndocument.getElementById('yes').onclick=()=>{document.getElementById('feedback').textContent='Terima kasih sudah memilih.';popup('✓','TERSIMPAN ❤️','Makasih ya sayang. Apapun jawabannya, aku bakal selalu berusaha buat jadi yang terbaik buat kamu dan kita bisa terus bareng selamanya.')};\ndocument.getElementById('shy').onclick=()=>{let a=['Tidak apa-apa. Kamu boleh memikirkannya dulu.','Jawaban yang jujur lebih berarti daripada jawaban yang terburu-buru.','Tidak perlu memaksakan jawaban sekarang.'];document.getElementById('feedback').textContent=a[Math.floor(Math.random()*a.length)]};\ndocument.getElementById('letterBtn').onclick=()=>{const t=document.getElementById('lettertext'),b=document.getElementById('letterBtn');if(t.classList.contains('open')){clearInterval(window.letterTypingTimer);t.classList.remove('open','typing');if(t.dataset.fullText!==undefined)t.textContent=t.dataset.fullText;b.textContent='Buka pesan';return}if(t.dataset.fullText===undefined)t.dataset.fullText=t.textContent;const chars=Array.from(t.dataset.fullText);t.textContent='';t.classList.add('open','typing');b.textContent='Tutup pesan';let i=0;clearInterval(window.letterTypingTimer);window.letterTypingTimer=setInterval(()=>{if(i>=chars.length){clearInterval(window.letterTypingTimer);t.classList.remove('typing');return}t.textContent+=chars[i++];},18)};\ndocument.getElementById('finalBtn').onclick=()=>{popup('✓','TERIMA KASIH','Semoga pesan sederhana ini bisa menjadi pengingat untuk tetap menjaga hal-hal baik dalam hidupmu.')};\ndocument.getElementById('close').onclick=()=>modal.classList.remove('open');modal.onclick=e=>{if(e.target===modal)modal.classList.remove('open')};document.addEventListener('keydown',e=>{if(e.key==='Escape')modal.classList.remove('open')});\nconst lightbox=document.getElementById('lightbox');let photoIndex=0;const photoCards=[...document.querySelectorAll('.photo')];function openPhoto(i){photoIndex=(i+photoCards.length)%photoCards.length;const card=photoCards[photoIndex],img=card.querySelector('img');if(!img.src||img.style.display==='none')return;document.getElementById('lightImage').src=img.src;document.getElementById('lightCaption').textContent=card.querySelector('.caption').textContent;document.getElementById('lightCounter').textContent=`FOTO ${String(photoIndex+1).padStart(2,'0')} / ${String(photoCards.length).padStart(2,'0')}`;lightbox.classList.add('open')}photoCards.forEach((card,i)=>card.addEventListener('click',()=>openPhoto(i)));document.getElementById('lightClose').onclick=()=>lightbox.classList.remove('open');document.getElementById('lightPrev').onclick=()=>openPhoto(photoIndex-1);document.getElementById('lightNext').onclick=()=>openPhoto(photoIndex+1);lightbox.addEventListener('click',e=>{if(e.target===lightbox)lightbox.classList.remove('open')});document.addEventListener('keydown',e=>{if(e.key==='Escape'){lightbox.classList.remove('open');modal.classList.remove('open')}if(lightbox.classList.contains('open')&&e.key==='ArrowRight')openPhoto(photoIndex+1);if(lightbox.classList.contains('open')&&e.key==='ArrowLeft')openPhoto(photoIndex-1)});\n\n// Interactive mini games\nfunction pickGame(id){document.querySelectorAll('.minigame').forEach(x=>x.classList.toggle('activegame',x.id===id));document.querySelectorAll('.game-tabs .btn').forEach((b,i)=>{b.classList.toggle('primary',['claw','wheelgame','puzzlegame'][i]===id);b.classList.toggle('soft',['claw','wheelgame','puzzlegame'][i]!==id)});}\nlet clawX=50, clawBusy=false;function clawPosition(){document.getElementById('clawLine').style.left=clawX+'%';document.getElementById('clawHook').style.left=clawX+'%';document.getElementById('clawFingers').style.left=clawX+'%'}\ndocument.getElementById('clawLeft').onclick=()=>{if(!clawBusy){clawX=Math.max(8,clawX-10);clawPosition();document.getElementById('clawStatus').textContent='Posisi capit: '+Math.round(clawX)+'%'}};document.getElementById('clawRight').onclick=()=>{if(!clawBusy){clawX=Math.min(92,clawX+10);clawPosition();document.getElementById('clawStatus').textContent='Posisi capit: '+Math.round(clawX)+'%'}};\ndocument.getElementById('clawDrop').onclick=()=>{if(clawBusy)return;clawBusy=true;const line=document.getElementById('clawLine'),hook=document.getElementById('clawHook'),fingers=document.getElementById('clawFingers'),status=document.getElementById('clawStatus'),prize=document.getElementById('clawPrize');line.style.height='150px';hook.style.top='140px';fingers.style.top='158px';fingers.textContent='⌃';status.textContent='Capit sedang mengambil hadiah…';setTimeout(()=>{let toys=[...document.querySelectorAll('.toy')],nearest=toys.sort((a,b)=>Math.abs(parseFloat(a.style.left)-clawX)-Math.abs(parseFloat(b.style.left)-clawX))[0];if(nearest&&Math.abs(parseFloat(nearest.style.left)-clawX)\u003c20){let got=nearest.dataset.prize;nearest.style.transform='translateY(-105px) scale(.8)';nearest.style.opacity='.25';prize.innerHTML=got+'\u003cbr>\u003cb>Hadiah berhasil diambil!\u003c/b>';status.textContent='Berhasil! Hadiah dibawa ke tempat pengambilan.';if(got==='🎁'){burst();setTimeout(()=>popup('🎁','MYSTERY LOVE BOX','Untuk kamu: semoga hari-harimu dipenuhi hal baik. Terima kasih sudah menjadi bagian yang berarti. 🤍💗💖'),350)}else if(got==='💌'){burst();setTimeout(()=>popup('💌','SURAT RAHASIA','Ada hal yang ingin kusampaikan: semoga kamu selalu merasa dihargai, didengar, dan disayangi dengan cara yang baik.'),350)}else{popup(got,'HADIAH DIDAPAT','Kamu berhasil mengambil hadiah dari mesin. Coba lagi untuk menemukan hadiah lainnya!')}}else{status.textContent='Belum kena hadiah. Geser capit dan coba lagi.';prize.innerHTML='🤍\u003cbr>Belum berhasil — coba lagi.'}fingers.textContent='⌄';line.style.height='42px';hook.style.top='34px';fingers.style.top='53px';setTimeout(()=>clawBusy=false,700)},700)};\nconst wheelMessages=['🎁 Mystery Box — sebuah kejutan kecil untukmu.','🧸 Boneka — semoga jadi pengingat untuk tersenyum.','💌 Surat Rahasia — ada pesan yang tulus untukmu.','💖 Love — terima kasih sudah hadir.','✨ Wish — semoga hal baik mendatangimu.','🤍 Bonus — jangan lupa menjaga dirimu sendiri.'];let spinDeg=0,spinning=false;document.getElementById('spinBtn').onclick=()=>{if(spinning)return;spinning=true;let idx=Math.floor(Math.random()*6);spinDeg+=1440+(idx*60)+Math.random()*25;const w=document.getElementById('wheel');w.style.transform='rotate('+spinDeg+'deg)';document.getElementById('wheelResult').textContent='Roda sedang berputar…';setTimeout(()=>{document.getElementById('wheelResult').textContent=wheelMessages[idx];spinning=false;if(idx===0)burst()},4100)};\nlet tiles=[];const photoUrl=PHOTO_URLS[0];function puzzleInit(){tiles=[0,1,2,3,4,5,6,7,8];let empty=8,prev=-1;for(let n=0;n\u003c90;n++){let opts=[empty-3,empty+3,empty-1,empty+1].filter(i=>i>=0&&i\u003c9&&!(Math.abs(i-empty)===1&&Math.floor(i/3)!==Math.floor(empty/3))&&i!==prev);if(!opts.length)continue;let j=opts[Math.floor(Math.random()*opts.length)];[tiles[empty],tiles[j]]=[tiles[j],tiles[empty]];prev=empty;empty=j}puzzleRender()}\nfunction puzzleRender(){const el=document.getElementById('puzzle');el.innerHTML='';tiles.forEach((v,i)=>{const b=document.createElement('button');b.className='tile'+(v===8?' empty':'');if(v!==8){b.style.backgroundPosition=(v%3*50)+'% '+(Math.floor(v/3)*50)+'%';b.style.setProperty('--puzzle-image','url(\"'+photoUrl+'\")');b.setAttribute('aria-label','Potongan foto '+(v+1))}else{b.textContent='♡'}b.onclick=()=>{let e=tiles.indexOf(8),valid=[e-3,e+3,e-1,e+1].includes(i)&&!(Math.abs(i-e)===1&&Math.floor(i/3)!==Math.floor(e/3));if(valid){[tiles[i],tiles[e]]=[tiles[e],tiles[i]];puzzleRender()}};el.appendChild(b)});let won=tiles.every((v,i)=>v===i);document.getElementById('puzzleResult').textContent=won?'Berhasil! Foto tersusun kembali. 💗':'Geser potongan foto ke kotak kosong.';if(won){burst();setTimeout(()=>popup('🧩','PUZZLE SELESAI','Kamu berhasil menyusun foto sampai utuh kembali. 🤍💗💖'),200)}}document.getElementById('shufflePuzzle').onclick=puzzleInit;puzzleInit();\n\u003c/script>\u003c/body>\u003c/html>";</script><script>window.addEventListener("message",function(e){if(!e.data||e.data.type!=="FOR_YOU_GAME_FULLSCREEN")return;document.body.classList.toggle("game-fullscreen-shell",!!e.data.active);const h=document.querySelector(".topbar"),m=document.querySelector("body>main"),f=document.querySelector("body>main>.frame");if(e.data.active){if(h)h.style.display="none";if(m){m.style.position="fixed";m.style.inset="0";m.style.width="100vw";m.style.height="100vh";m.style.height="100dvh";m.style.zIndex="99999"}if(f){f.style.position="absolute";f.style.inset="0";f.style.width="100%";f.style.height="100%"}}else{if(h)h.style.display="";if(m){m.style.position="relative";m.style.inset="";m.style.width="";m.style.height="";m.style.zIndex=""}if(f){f.style.position="absolute";f.style.inset="0";f.style.width="100%";f.style.height="100%"}}});</script></body></html>
